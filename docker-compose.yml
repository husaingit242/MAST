services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mast
      POSTGRES_USER: mast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mast-dev-only}
    volumes:
      - mast-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mast -d mast"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://mast:${POSTGRES_PASSWORD:-mast-dev-only}@db:5432/mast
      UPLOAD_DIRECTORY: /var/lib/mast/uploads
      TEMP_UPLOAD_DIRECTORY: /var/lib/mast/tmp/uploads
      REPORT_DIRECTORY: /var/lib/mast/reports
    volumes:
      - mast-files:/var/lib/mast
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  mast-postgres:
  mast-files:
